<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1b2b4d"/>
      <stop offset="55%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </radialGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- decorative route line (like migration routes) -->
  <path d="M 60 470 C 260 380, 420 430, 620 360 S 980 240, 1140 180"
        fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="10 8" opacity=".45"/>
  <circle cx="60" cy="470" r="6" fill="#38bdf8" opacity=".9"/>
  <circle cx="1140" cy="180" r="6" fill="#f43f5e" opacity=".9"/>

  <!-- subtle grid dots -->
  <g fill="#22314f" opacity=".6">
    <circle cx="120" cy="130" r="3"/><circle cx="220" cy="180" r="3"/>
    <circle cx="320" cy="120" r="3"/><circle cx="900" cy="430" r="3"/>
    <circle cx="1020" cy="480" r="3"/><circle cx="1080" cy="380" r="3"/>
    <circle cx="760" cy="500" r="3"/><circle cx="880" cy="560" r="3"/>
  </g>

  <!-- icon -->
  <g transform="translate(110 155) scale(4.7)">
    <rect width="64" height="64" rx="14" fill="#0b1220" stroke="#22314f" stroke-width="2"/>
    <path fill="#22314f" d="M12 46 L32 18 L52 46 Z"/>
    <circle cx="32" cy="36" r="11" fill="url(#g)"/>
    <path fill="#0b1220" d="M27 44 L32 32 L37 44 Z" opacity=".85"/>
    <circle cx="32" cy="36" r="3.2" fill="#0b1220"/>
  </g>

  <!-- texts -->
  <text x="400" y="305" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="74" font-weight="700" fill="#e8eefb">
    MigrationFlow <tspan fill="#38bdf8">OSINT</tspan>
  </text>
  <text x="402" y="382" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#aab8d4">
    Flujos migratorios y desplazamiento forzado a escala global
  </text>

  <!-- source line -->
  <text x="402" y="500" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#5b6b8c">
    UNHCR · IDMC · IOM DTM · Missing Migrants Project · ReliefWeb
  </text>
</svg>
